services:
  - type: web
    name: efootmatch
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app run.py db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VIEWER_EMAIL
        sync: false
      - key: VIEWER_PASSWORD
        sync: false
