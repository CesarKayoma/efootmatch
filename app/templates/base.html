<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96.png') }} "sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <title>eFootMatch</title>
    <style>
        :root {
            --font-inter: "Inter";

            --default-font-family:
                var(--font-inter),
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            --default-mono-font-family:
                ui-monospace,
                "Cascadia Code",
                "Source Code Pro",
                Menlo,
                monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--default-font-family);
            margin: 0;
            padding: 0;
        }
        .page {
            display: flex;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            padding: 10px;
            background-color: #cfebcd;
            min-height: 100vh;
            width: 150px;
        }

        .navbar a.navs {
            color: rgb(18, 20, 121);
            padding: 10px 0px;
            padding-left: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .navbar a.navs:hover {
            background-color: #c0ddbe;
            border-radius: 10px;
        }

        .navbar img {
            padding: 10px 0px;
            padding-right: 10px;
            transition: transform 0.2s ease-in-out;
        } 

        .navbar img:hover {
            transform: scale(1.02);
        }

        .logo {
            width: 140px;
            height: auto;
        }   

        .content {
            padding: 10px;
        }

        /* =========================
            MATCHES PAGE
            ========================= */

        .matches-page {
            padding: 30px 40px;
            width: 100%;
            max-width: 1100px;
        }

        /* Header */

        .matches-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .matches-header h1 {
            margin: 0;
            color: #121479;
            font-size: 28px;
        }

        .matches-header p {
            margin: 6px 0 0;
            color: #666;
            font-size: 14px;
        }

        .register-button {
            background-color: #121479;
            color: white;
            padding: 11px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .register-button:hover {
            background-color: #0d0f5e;
            transform: translateY(-1px);
        }


        /* Match list */

        .matches {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        /* Individual match */

        .match {
            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 14px;
            padding: 22px 24px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .match:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
        }


        /* Teams + score */

        .teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 25px;
        }

        .home-team,
        .away-team {
            font-size: 19px;
            font-weight: 700;
            color: #222;
        }

        .home-team {
            text-align: right;
        }

        .away-team {
            text-align: left;
        }

        .score {
            background-color: #cfebcd;
            color: #121479;

            padding: 9px 16px;
            border-radius: 10px;

            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }


        /* Match metadata */

        .match-info {
            display: flex;
            justify-content: center;
            gap: 25px;

            margin-top: 14px;
            padding-top: 12px;

            border-top: 1px solid #eeeeee;

            color: #777;
            font-size: 12px;
        }

        .match-info span.motm {
            color: #b8860b;
            font-weight: 600;
        }


        /* Goals */

        .goals {
            display: flex;
            justify-content: center;
            gap: 50px;

            margin-top: 16px;
            padding-top: 14px;

            border-top: 1px solid #eeeeee;
        }

        .home-goals {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .away-goals {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .goal {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .goal:last-child {
            margin-bottom: 0;
        }

        .goal-text {
            display: flex;
            flex-direction: column;
        }

        .home-goals .goal {
            justify-content: flex-end;
        }

        .home-goals .goal-text {
            align-items: flex-end;
            text-align: right;
        }

        .away-goals .goal {
            justify-content: flex-start;
        }

        .away-goals .goal-text {
            align-items: flex-start;
            text-align: left;
        }

        .scorer-name {
            font-size: 14px;
            font-weight: 700;
            color: #222;
        }

        .away-goals .scorer-name {
            font-weight: 500;
            color: #444;
        }

        .assist {
            font-size: 12px;
            color: #5b6fd8;
            margin-top: 1px;
        }

        .scorer-icon {
            font-size: 15px;
            flex-shrink: 0;
        }


        /* =========================
            DASHBOARD PAGE
            ========================= */

        .dashboard-page {
            padding: 30px 40px;
            width: 100%;
            max-width: 1100px;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            margin: 0;
            color: #121479;
            font-size: 28px;
        }

        .dashboard-header p {
            margin: 6px 0 0;
            color: #666;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;

            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 14px;
            padding: 26px 20px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.07);
        }

        .stat-card.highlight {
            background-color: #cfebcd;
            border-color: #cfebcd;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #121479;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        /* =========================
            FLASH MESSAGES
            ========================= */

        .flash-messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .flash {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .flash-success {
            background-color: #cfebcd;
            color: #121479;
        }

        .flash-error {
            background-color: #fbdada;
            color: #a11d1d;
        }


        /* =========================
            MATCH FORM PAGE
            ========================= */

        .match-form-page {
            padding: 30px 40px;
            width: 100%;
            max-width: 900px;
        }

        .match-summary {
            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
        }

        .match-summary .goals {
            min-height: 20px;
        }

        .divider {
            border: none;
            border-top: 1px solid #e2e7e2;
            margin: 24px 0;
        }

        .goal-entry {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .team-picker {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: 700;
            color: #222;
        }

        .team-picker label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .entry-fields {
            display: flex;
            align-items: flex-end;
            gap: 18px;
            flex-wrap: wrap;
        }

        .combo-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .combo-field label {
            font-size: 14px;
            color: #444;
            font-weight: 600;
        }

        .combo {
            position: relative;
            width: 240px;
        }

        .combo input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #222;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .combo input[type="text"]:focus {
            outline: none;
            border-color: #121479;
        }

        .combo-list {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 10;

            list-style: none;
            margin: 0;
            padding: 4px;

            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 8px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.1);

            max-height: 220px;
            overflow-y: auto;

            display: none;
        }

        .combo-option {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .combo-option:hover,
        .combo-option.active {
            background-color: #cfebcd;
        }

        .own-goal-check {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #444;
            padding-bottom: 10px;
        }

        .add-goal-button {
            background-color: #2fa84f;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            height: fit-content;
        }

        .add-goal-button:hover {
            background-color: #268a41;
            transform: translateY(-1px);
        }

        .remove-goal-btn {
            background: none;
            border: none;
            color: #bbb;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
            padding: 0 2px;
        }

        .remove-goal-btn:hover {
            color: #a11d1d;
        }

        .motm-field {
            margin-bottom: 24px;
        }

        .save-button {
            border: none;
            font-size: 15px;
            cursor: pointer;
            background-color: #2fa84f;
        }

        .save-button:hover {
            background-color: #268a41;
        }


        /* =========================
            MATCH CARD ACTIONS
            ========================= */

        .match-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #eeeeee;
        }

        .match-actions a,
        .match-actions button {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            color: #777;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
        }

        .match-actions a:hover {
            color: #121479;
        }

        .match-actions button:hover {
            color: #a11d1d;
        }


        /* =========================
            GENERIC FORM PAGE
            ========================= */

        .form-page {
            padding: 30px 40px;
            width: 100%;
            max-width: 600px;
        }

        .form-page h1 {
            margin: 0 0 24px;
            color: #121479;
            font-size: 28px;
        }

        .player-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-field label {
            font-size: 14px;
            font-weight: 600;
            color: #444;
        }

        .text-input {
            padding: 10px 12px;
            border: 2px solid #222;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .text-input:focus {
            outline: none;
            border-color: #121479;
        }

        .radio-group {
            display: flex;
            gap: 20px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            color: #222;
            cursor: pointer;
        }

        .field-error {
            font-size: 12px;
            color: #a11d1d;
        }


        /* =========================
            PLAYERS PAGE
            ========================= */

        .players-page {
            padding: 30px 40px;
            width: 100%;
            max-width: 1100px;
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .players-header h1 {
            margin: 0;
            color: #121479;
            font-size: 28px;
        }

        .players-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .players-column {
            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 14px;
            padding: 22px 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .players-column-title {
            margin: 0 0 16px;
            color: #121479;
            font-size: 18px;
        }

        .players-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .player-row:last-child {
            border-bottom: none;
        }

        .player-name {
            font-size: 15px;
            font-weight: 600;
            color: #222;
        }

        .player-actions {
            display: flex;
            gap: 12px;
        }

        .player-actions a,
        .player-actions button {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 600;
            color: #777;
            text-decoration: none;
            cursor: pointer;
            font-family: inherit;
        }

        .player-actions a:hover {
            color: #121479;
        }

        .player-actions button:hover {
            color: #a11d1d;
        }

        .players-empty {
            color: #999;
            font-size: 14px;
            font-style: italic;
        }


        /* =========================
            TOASTS
            ========================= */

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 10px;
            padding: 14px 18px;
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.12);

            font-size: 14px;
            font-weight: 600;
            color: #121479;

            max-width: 320px;

            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .toast-visible {
            opacity: 1;
            transform: translateX(0);
        }

        .toast-success {
            border-left: 4px solid #2fa84f;
        }

        .toast-error {
            border-left: 4px solid #a11d1d;
            color: #a11d1d;
        }


        /* =========================
            DASHBOARD CHARTS
            ========================= */

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 24px;
        }

        .chart-card {
            background-color: white;
            border: 1px solid #e2e7e2;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .chart-card h3 {
            margin: 0 0 14px;
            color: #121479;
            font-size: 15px;
            text-align: center;
        }

    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <script>
        function showToast(message, category) {
            const container = document.getElementById("toast-container");

            const toast = document.createElement("div");
            toast.className = "toast toast-" + (category || "success");
            toast.textContent = message;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.add("toast-visible");
            });

            setTimeout(() => {
                toast.classList.remove("toast-visible");
                toast.addEventListener("transitionend", () => toast.remove(), { once: true });
            }, 4000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    showToast({{ message | tojson }}, {{ category | tojson }});
                {% endfor %}
            {% endwith %}

            {% if form is defined and form %}
                {% for field_name, field_errors in form.errors.items() %}
                    {% for error in field_errors %}
                        showToast({{ error | tojson }}, "error");
                    {% endfor %}
                {% endfor %}
            {% endif %}
        });
    </script>

    <div class="page">
        <div class="navbar">
            <a href="{{ url_for('home.home') }}" >
                <img src="{{ url_for('static', filename='logo_name.png') }}" class="logo">
            </a>
            <hr style="width: 100%;">
            <a href="{{ url_for('home.home') }}" class="navs">Home</a>
            <a href="{{ url_for('matches.home') }}" class="navs">Matches</a>
            <a href="{{ url_for('teams.home') }}" class="navs">Teams</a>
            <a href="{{ url_for('players.home') }}" class="navs">Players</a>
        </div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
