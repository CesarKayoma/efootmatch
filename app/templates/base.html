<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon-96x96.png') }} "sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <title>eFootMatch</title>
    <style>
        :root {
            --font-inter: "Inter";

            --default-font-family:
                var(--font-inter),
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            --default-mono-font-family:
                ui-monospace,
                "Cascadia Code",
                "Source Code Pro",
                Menlo,
                monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--default-font-family);
            margin: 0;
            padding: 0;
        }
        .page {
            display: flex;
        }

        .navbar {
            display: flex;
            flex-direction: column;
            padding: 10px;
            background-color: #cfebcd;
            height: 100vh;
            width: 150px;
        }

        .navbar a.navs {
            color: rgb(18, 20, 121);
            padding: 10px 0px;
            padding-left: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .navbar a.navs:hover {
            background-color: #c0ddbe;
            border-radius: 10px;
        }

        .navbar img {
            padding: 10px 0px;
            padding-right: 10px;
            transition: transform 0.2s ease-in-out;
        } 

        .navbar img:hover {
            transform: scale(1.02);
        }

        .logo {
            width: 140px;
            height: auto;
        }   

        .content {
            padding: 10px;
        }

    </style>
</head>
<body>
    <div class="page">
        <div class="navbar">
            <a href="{{ url_for('home.home') }}" >
                <img src="{{ url_for('static', filename='logo_name.png') }}" class="logo">
            </a>
            <hr style="width: 100%;">
            <a href="{{ url_for('home.home') }}" class="navs">Home</a>
            <a href="{{ url_for('matches.home') }}" class="navs">Matches</a>
            <a href="{{ url_for('teams.home') }}" class="navs">Teams</a>
            <a href="{{ url_for('players.home') }}" class="navs">Players</a>
        </div>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
